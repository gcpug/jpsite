steps:
  # angular build
  - name: node:26
    id: npm-ci
    entrypoint: 'npm'
    args: ['ci']
    dir: 'frontend'
  - name: node:26
    id: npm-run
    entrypoint: 'npm'
    args: ['run', 'build:prod']
    dir: 'frontend'
    waitFor: ['npm-ci']
  # deploy to firebase hosting
  - name: node:26
    id: firebase-deploy
    entrypoint: 'npx'
    args: ['--yes', 'firebase-tools@15.34.2', 'deploy', '--only', 'hosting', '--project', '$PROJECT_ID', '--non-interactive']
    waitFor: ['npm-run']
